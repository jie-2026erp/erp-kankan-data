<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手机远程打印</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
body { background: #f5f5f5; padding: 16px; }
h1 { font-size: 20px; text-align: center; margin-bottom: 20px; color: #333; }
.shipment-card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
.shipment-info .code { font-size: 18px; font-weight: bold; color: #333; }
.shipment-info .meta { font-size: 14px; color: #666; margin-top: 4px; }
.print-btn { background: #1677ff; color: white; border: none; border-radius: 8px; padding: 12px 20px; font-size: 16px; font-weight: bold; cursor: pointer; }
.print-btn:disabled { background: #999; }
.status { font-size: 14px; color: #52c41a; margin-top: 8px; text-align: center; }
</style>
</head>
<body>
<h1>📱 手机远程打印</h1>
<div id="shipmentList"></div>
<script>
const GITHUB_DATA_URL = "https://jie-2026erp.github.io/erp-kankan-data/timely_data.json";
const PRINT_TASKS_URL = "https://jie-2026erp.github.io/erp-kankan-data/print_tasks.json";

async function loadPendingShipments() {
  const res = await fetch(GITHUB_DATA_URL);
  const data = await res.json();
  const list = data.pack3.list.filter(r => r.hours < 3 && r.space.startsWith('FH'));
  const taskRes = await fetch(PRINT_TASKS_URL);
  const tasks = await taskRes.json();
  const doneCodes = new Set(tasks.filter(t => t.status === 'done').map(t => t.code));
  const pendingCodes = new Set(tasks.filter(t => t.status === 'pending').map(t => t.code));
  const container = document.getElementById('shipmentList');
  container.innerHTML = '';
  list.forEach(shipment => {
    const card = document.createElement('div');
    card.className = 'shipment-card';
    const isPending = pendingCodes.has(shipment.code);
    const isDone = doneCodes.has(shipment.code);
    card.innerHTML = `
      <div class="shipment-info">
        <div class="code">${shipment.code}</div>
        <div class="meta">库位: ${shipment.space} | ${shipment.box_total}箱</div>
      </div>
      <button class="print-btn" ${isPending || isDone ? 'disabled' : ''} onclick="sendPrintTask('${shipment.code}')">
        ${isPending ? '打印中...' : isDone ? '已打印' : '打印'}
      </button>
    `;
    container.appendChild(card);
  });
}

async function sendPrintTask(code) {
  alert(`已发送打印请求: ${code}`);
  // 这里后续接GitHub API写任务，现在先提示
  setTimeout(() => location.reload(), 1500);
}

loadPendingShipments();
setInterval(loadPendingShipments, 10000);
</script>
</body>
</html>
