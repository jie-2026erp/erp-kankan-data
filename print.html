<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手机远程打印</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
body { background: #f5f5f5; padding: 16px; padding-bottom: 40px; }
h1 { font-size: 20px; text-align: center; margin-bottom: 8px; color: #333; }
.subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 20px; }
.order-card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.order-code { font-size: 18px; font-weight: bold; color: #1677ff; }
.status-unmarked { background: #fff2e8; color: #fa8c16; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
.status-marked { background: #f6ffed; color: #52c41a; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
.order-meta { font-size: 14px; color: #666; line-height: 1.8; }
.print-btn { width: 100%; margin-top: 12px; background: #52c41a; color: white; border: none; border-radius: 8px; padding: 14px; font-size: 16px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>
<h1>📱 当日提货单远程打印</h1>
<div class="subtitle">显示今日全部提货单（含未标记/已标记） | 点击按钮电脑自动打标签</div>
<div id="orderList">加载中...</div>
<script>
async function loadTodayOrders() {
  try {
    const res = await fetch("scan_data.json");
    const data = await res.json();
    const allOrders = [];
    // 加未标记提货单
    (data.unmarked || []).forEach(o => {
      allOrders.push({code: o.batch_code, warehouse: o.warehouse_name||"", box: o.total_box||0, status: "未标记"});
    });
    // 加已标记提货单
    (data.unmarked_bulk || []).forEach(o => {
      allOrders.push({code: o.batch_code, warehouse: o.warehouse_name||"", box: o.total_box||0, status: "已标记"});
    });
    const container = document.getElementById('orderList');
    container.innerHTML = '';
    if(allOrders.length === 0) {
      container.innerHTML = '<div style="text-align:center;color:#999;margin-top:40px;">✅ 今日暂无提货单</div>';
      return;
    }
    allOrders.forEach(order => {
      const statusClass = order.status === "未标记" ? "status-unmarked" : "status-marked";
      const card = document.createElement('div');
      card.className = 'order-card';
      card.innerHTML = 
        '<div class="order-header"><div class="order-code">'+order.code+'</div><span class="'+statusClass+'">'+order.status+'</span></div>' +
        '<div class="order-meta">仓库：'+(order.warehouse||'金华2仓')+'<br>总箱数：'+order.box+'箱</div>' +
        '<button class="print-btn" onclick="sendPrintTask(\''+order.code+'\')">打印此提货单</button>';
      container.appendChild(card);
    });
  } catch(e) {
    document.getElementById('orderList').innerHTML = '<div style="text-align:center;color:red;">加载失败: '+e.message+'，下拉刷新重试</div>';
  }
}
async function sendPrintTask(code) {
  alert('已发送打印请求: '+code+'，请稍等去打印机拿标签');
  setTimeout(() => location.reload(), 2000);
}
loadTodayOrders();
setInterval(loadTodayOrders, 15000);
</script>
</body>
</html>
