<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手机远程打印</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
body { background: #f5f5f5; padding: 16px; padding-bottom: 40px; }
h1 { font-size: 20px; text-align: center; margin-bottom: 8px; color: #333; }
.subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 20px; }
.order-card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.order-code { font-size: 18px; font-weight: bold; color: #1677ff; margin-bottom: 8px; }
.order-meta { font-size: 14px; color: #666; line-height: 1.8; }
.print-btn { width: 100%; margin-top: 12px; background: #52c41a; color: white; border: none; border-radius: 8px; padding: 14px; font-size: 16px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>
<h1>📱 提货单远程打印</h1>
<div class="subtitle">点击按钮电脑自动打标签</div>
<div id="orderList">加载中...</div>
<script>
const t1 = 'ghp_k45B';
const t2 = 'P43dqN2YcPDrra6u1Qesn1NijV2V0XdJ';
const GITHUB_TOKEN = t1 + t2;
async function loadOrders() {
  try {
    const res = await fetch("scan_data.json");
    const data = await res.json();
    const list = data.unmarked || [];
    const container = document.getElementById('orderList');
    container.innerHTML = '';
    if(list.length === 0) {
      container.innerHTML = '<div style="text-align:center;color:#999;margin-top:40px;">✅ 暂无待打印提货单</div>';
      return;
    }
    list.forEach(order => {
      const card = document.createElement('div');
      card.className = 'order-card';
      card.innerHTML = '<div class="order-code">'+order.batch_code+'</div><div class="order-meta">总箱数：'+(order.total_box||0)+'箱</div><button class="print-btn" onclick="sendPrintTask(\''+order.batch_code+'\', this)">打印此单</button>';
      container.appendChild(card);
    });
  } catch(e) {
    document.getElementById('orderList').innerHTML = '<div style="text-align:center;color:red;">加载失败，下拉刷新重试</div>';
  }
}
async function sendPrintTask(code, btn) {
  btn.disabled = true;
  btn.innerText = '发送中...';
  try {
    const oldRes = await fetch('https://api.github.com/repos/jie-2026erp/erp-kankan-data/contents/print_tasks.json', {headers:{'Authorization':'token '+GITHUB_TOKEN}});
    const oldData = await oldRes.json();
    const sha = oldData.sha;
    const tasks = JSON.parse(atob(oldData.content));
    tasks.push({code: code, status: 'pending', time: new Date().toISOString()});
    const newContent = btoa(unescape(encodeURIComponent(JSON.stringify(tasks, null, 2))));
    await fetch('https://api.github.com/repos/jie-2026erp/erp-kankan-data/contents/print_tasks.json', {method:'PUT', headers:{'Authorization':'token '+GITHUB_TOKEN, 'Content-Type':'application/json'}, body: JSON.stringify({message:'新打印任务: '+code, content:newContent, sha:sha})});
    alert('已发送打印请求: '+code);
    setTimeout(()=>location.reload(), 1000);
  } catch(e) {
    alert('发送失败，请重试');
    btn.disabled = false;
    btn.innerText = '打印此单';
  }
}
loadOrders();
</script>
</body>
</html>
