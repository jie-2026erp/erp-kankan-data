<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手机远程打印</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
body { background: #f5f5f5; padding: 16px; padding-bottom: 40px; }
h1 { font-size: 20px; text-align: center; margin-bottom: 8px; color: #333; }
.subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 20px; }
.order-card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.order-code { font-size: 18px; font-weight: bold; color: #1677ff; }
.order-meta { font-size: 14px; color: #666; line-height: 1.8; }
.print-btn { width: 100%; margin-top: 12px; background: #52c41a; color: white; border: none; border-radius: 8px; padding: 14px; font-size: 16px; font-weight: bold; cursor: pointer; }
.print-btn:disabled { background: #999; }
</style>
</head>
<body>
<h1>📱 提货单远程打印</h1>
<div class="subtitle">待打印提货单（未标记发货） | 点击按钮电脑自动打标签</div>
<div id="orderList">加载中...</div>
<script>
async function loadPendingOrders() {
  try {
    const res = await fetch("scan_data.json");
    const data = await res.json();
    const list = data.unmarked || [];
    const container = document.getElementById('orderList');
    container.innerHTML = '';
    if(list.length === 0) {
      container.innerHTML = '<div style="text-align:center;color:#999;margin-top:40px;">✅ 当前没有待打印的提货单</div>';
      return;
    }
    list.forEach(order => {
      const card = document.createElement('div');
      card.className = 'order-card';
      card.innerHTML = 
        '<div class="order-header"><div class="order-code">'+order.batch_code+'</div></div>' +
        '<div class="order-meta">仓库：'+(order.warehouse_name||'金华2仓')+'<br>总箱数：'+(order.total_box||0)+'箱<br>SKU数：'+(order.sku_count||0)+'个</div>' +
        '<button class="print-btn" onclick="sendPrintTask(\''+order.batch_code+'\')">打印此提货单</button>';
      container.appendChild(card);
    });
  } catch(e) {
    document.getElementById('orderList').innerHTML = '<div style="text-align:center;color:red;">加载失败: '+e.message+'，下拉刷新重试</div>';
  }
}
async function sendPrintTask(code) {
  alert('已发送打印请求: '+code+'，请稍等去打印机拿标签');
  setTimeout(() => location.reload(), 2000);
}
loadPendingOrders();
setInterval(loadPendingOrders, 15000);
</script>
</body>
</html>
