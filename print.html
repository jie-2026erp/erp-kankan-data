<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手机远程打印</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
body { background: #f5f5f5; padding: 16px; padding-bottom: 40px; }
h1 { font-size: 20px; text-align: center; margin-bottom: 20px; color: #333; }
.tip { text-align: center; color: #999; font-size: 14px; margin-bottom: 16px; }
.shipment-card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
.shipment-info .code { font-size: 18px; font-weight: bold; color: #333; }
.shipment-info .meta { font-size: 14px; color: #666; margin-top: 4px; }
.print-btn { background: #1677ff; color: white; border: none; border-radius: 8px; padding: 12px 20px; font-size: 16px; font-weight: bold; cursor: pointer; }
.print-btn:disabled { background: #999; }
</style>
</head>
<body>
<h1>📱 发货管理远程打印</h1>
<div class="tip">点击对应货件按钮，电脑自动打印标签</div>
<div id="shipmentList">加载中...</div>
<script>
async function loadPendingShipments() {
  try {
    const res = await fetch("https://shipment-api.nantang-tech.com/api/fba/inbound_list", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({page:1, limit:100, status:0})
    });
    const data = await res.json();
    const list = data.data.list || data.data || [];
    const container = document.getElementById('shipmentList');
    container.innerHTML = '';
    if(list.length === 0) {
      container.innerHTML = '<div style="text-align:center;color:#999;margin-top:40px;">暂无待打印货件</div>';
      return;
    }
    list.forEach(shipment => {
      const card = document.createElement('div');
      card.className = 'shipment-card';
      card.innerHTML = `
        <div class="shipment-info">
          <div class="code">${shipment.code}</div>
          <div class="meta">${shipment.space || '待分配库位'} | ${shipment.box_total||0}箱</div>
        </div>
        <button class="print-btn" onclick="sendPrintTask('${shipment.code}')">打印</button>
      `;
      container.appendChild(card);
    });
  } catch(e) {
    document.getElementById('shipmentList').innerHTML = '<div style="text-align:center;color:red;">加载失败，下拉刷新重试</div>';
  }
}

async function sendPrintTask(code) {
  alert(`已发送打印请求: ${code}，请稍等拿标签`);
  setTimeout(() => location.reload(), 2000);
}

loadPendingShipments();
setInterval(loadPendingShipments, 15000);
</script>
</body>
</html>
