<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手机远程打印</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
body { background: #f5f5f5; padding: 16px; padding-bottom: 40px; }
h1 { font-size: 20px; text-align: center; margin-bottom: 20px; color: #333; }
.tip { text-align: center; color: #999; font-size: 14px; margin-bottom: 16px; }
.order-card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
.order-info .code { font-size: 18px; font-weight: bold; color: #1677ff; }
.order-info .meta { font-size: 14px; color: #666; margin-top: 4px; }
.print-btn { background: #52c41a; color: white; border: none; border-radius: 8px; padding: 12px 20px; font-size: 16px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>
<h1>📱 提货单远程打印</h1>
<div class="tip">点击对应提货单按钮，电脑自动打印标签</div>
<div id="orderList">加载中...</div>
<script>
async function loadPendingOrders() {
  try {
    const res = await fetch("scan_data.json");
    const data = await res.json();
    const list = data.unmarked || [];
    const container = document.getElementById('orderList');
    container.innerHTML = '';
    if(list.length === 0) {
      container.innerHTML = '<div style="text-align:center;color:#999;margin-top:40px;">暂无待打印提货单</div>';
      return;
    }
    list.forEach(order => {
      const card = document.createElement('div');
      card.className = 'order-card';
      card.innerHTML = '<div class="order-info"><div class="code">'+order.batch_code+'</div><div class="meta">'+(order.warehouse_name||'')+' | '+(order.total_box||0)+'箱</div></div><button class="print-btn" onclick="alert(\'已发送打印请求: '+order.batch_code+'\')">打印</button>';
      container.appendChild(card);
    });
  } catch(e) {
    document.getElementById('orderList').innerHTML = '<div style="text-align:center;color:red;">加载失败: '+e.message+'</div>';
  }
}
loadPendingOrders();
</script>
</body>
</html>
